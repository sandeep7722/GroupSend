# Uses exactly the Dockerfile, application entrypoint and browser mode used by Render.
services:
  app:
    build:
      context: .
      dockerfile: cloud/Dockerfile.render
    env_file: .local-docker.env
    environment:
      PUBLIC_ORIGIN: http://localhost:4322
      PORT: '10000'
      MAX_WORKSPACES: '1'
      MAX_USERS: '30'
      TRUST_PROXY: '0'
    ports:
      - '127.0.0.1:4322:10000'
    volumes:
      - local_render_data:/data
    mem_limit: 2g
    cpus: 1
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:10000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  local_render_data:
